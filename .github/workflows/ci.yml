name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  canonical:
    name: Canonical Node 24
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use canonical Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release candidate
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  compatibility:
    name: Compatibility Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.22.0
            experimental: false
          - node-version: 26
            experimental: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use compatibility Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release candidate
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
